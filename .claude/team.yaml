# L'equipe Claude de BASE du template github-pages-ci : chaque agent et les skills
# qu'il precharge. Toute application creee depuis ce template en herite ;
# workon (etape 8) la complete pour son sujet. Compose par
# scripts/claude-team.sh (API Claude), relu, modifiable a la main ; pose par
# agency-agents.sh template github-pages-ci et claude-skills.sh template github-pages-ci.
agents:
  # Maintient le workflow .github/workflows/pages.yml, l'alignement ruby-version / image ruby:3.3 et la regeneration de Gemfile.lock, dont depend chaque publication par git push.
  engineering-devops-automator: [systematic-debugging, verification-before-completion]
  # Fait evoluer les gabarits Jekyll, le theme (minima et ses avertissements Sass), les includes et la page 404 sans casser les permaliens existants.
  engineering-frontend-developer: [frontend-design]
  # Redige et relit les articles en francais accentue dans _drafts/ puis _posts/, avec un front matter correct et en s'alignant sur le ton et les categories du site.
  marketing-content-creator: [copy-editing, content-strategy]
  # Verifie que le site statique publie sur GitHub Pages est bien indexable : sitemap, donnees structurees, metadonnees et qualite des pages.
  marketing-seo-specialist: [seo-technical, seo-sitemap, seo-schema, seo-content]
  # Relit les changements avant push, puisque chaque push est une publication publique immediate : front matter, exclusions de _config.yml, absence de secret dans le workflow.
  engineering-code-reviewer: [verification-before-completion]
skills_partages: [verification-before-completion, pplx-research, frontend-design, seo-audit]
