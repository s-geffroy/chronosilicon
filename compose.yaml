# Cette application ne fait tourner aucun service : le site est bati par GitHub
# Actions et servi par GitHub Pages. Ce fichier declare un OUTIL.
#
# Un seul service, qui ne tourne pas :
#   node -- Node LTS + navigateurs Playwright (image officielle Microsoft),
#           derriere le profil 'cli'. `sudo appctl run node <commande>` le lance
#           le temps d'une commande, puis le jette.
#
#   sudo appctl run node npm ci
#   sudo appctl run node npm run check      # lint+typecheck+data+tests+build
#   sudo appctl run node npm run test:e2e
#
# LE TAG DE L'IMAGE EST UNE DES DEUX VERITES : le workflow .github/workflows/ci.yml
# utilise exactement la meme image en 'container:'. Changer l'un sans l'autre,
# c'est reintroduire deux verites (voir docs/adr/ADR-0002). Le tag doit aussi
# rester egal a la version de @playwright/test dans package.json.
services:
  node:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["cli"]
    working_dir: /work
    volumes:
      - .:/work
    # uid/gid de l'utilisateur applicatif sur CE VPS (sinon fichiers root dans le depot).
    user: "1032:1033"
    networks:
      - internal
    # HOME et caches npm loges dans le depot (gitignores) : l'uid n'a pas de home
    # dans l'image.
    environment:
      HOME: /work/.cache/home
      npm_config_cache: /work/.cache/npm
      CI: "1"
      TZ: Europe/Paris
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
          pids: 1024

networks:
  internal:
    name: chronosilicon-internal
    external: true
