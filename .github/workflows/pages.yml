# Publication GitHub Pages -- uniquement depuis 'main' (ADR-0003).
#
# Prerequis MANUEL : Settings > Pages > Source = "GitHub Actions". Tant qu'il
# reste sur "Deploy from a branch", le job 'deploy' echoue avec une erreur
# d'API. Ne jamais rebasculer ce reglage.
#
# Les controles bloquants (lint, types, donnees, tests, e2e sous le vrai chemin
# de base) sont rejoues AVANT le build publie : rien n'est deploye si l'un
# d'eux echoue. Aucun secret : GITHUB_TOKEN + OIDC suffisent.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilege (revue M-6) : le build, qui execute `npm ci` et des
# dependances tierces, n'a que la lecture. Seul le job 'deploy', qui n'execute
# aucun code du depot, recoit pages:write et id-token:write.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --shm-size=1g
    env:
      CI: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run audit:gate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm test
      # Le chemin de base vient des reglages reels du depot (configure-pages),
      # pas d'une valeur codee en dur.
      # AUD-018 : un seul build. L'artefact est empreinte, teste tel quel
      # (E2E_PREBUILT=1, sans reconstruction), reverifie, puis televerse.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npm run dist:manifest -- write
      - run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          E2E_PREBUILT: '1'
      - run: npm run dist:manifest -- check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    # Jamais de publication depuis une autre branche, meme via workflow_dispatch (revue M-7).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
