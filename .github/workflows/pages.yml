# Publication GitHub Pages -- uniquement depuis 'main' (ADR-0003).
#
# Prerequis MANUEL : Settings > Pages > Source = "GitHub Actions". Tant qu'il
# reste sur "Deploy from a branch", le job 'deploy' echoue avec une erreur
# d'API. Ne jamais rebasculer ce reglage.
#
# Les controles bloquants (lint, types, donnees, tests, e2e sous le vrai chemin
# de base) sont rejoues AVANT le build publie : rien n'est deploye si l'un
# d'eux echoue. Aucun secret : GITHUB_TOKEN + OIDC suffisent.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --shm-size=1g
    env:
      CI: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm test
      # Le chemin de base vient des reglages reels du depot (configure-pages),
      # pas d'une valeur codee en dur.
      - run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
